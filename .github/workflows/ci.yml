name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and backtest smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install (also proves the dependency set resolves)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Backtest smoke test (public vaastav data, no secrets)
        run: python main.py backtest --season 2025-26
